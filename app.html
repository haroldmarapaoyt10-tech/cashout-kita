<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cashout Kita</title>
<style>
  html,body{margin:0;height:100%;background:#f3f4f6;font-family:system-ui,-apple-system,sans-serif}
  #app{border:0;width:100%;height:100%;display:block}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
  button{padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;font-size:14px}
  .small{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<iframe id="app" hidden></iframe>
<div id="boot">
  <div id="msg">Loading Cashout Kita…</div>
  <div class="small" id="sub"></div>
  <button id="retry" hidden onclick="start()">Subukan ulit</button>
</div>

<script>
// ⚠️ PALITAN ITO NG SARILI MONG URL
const APP_URL = 'https://raw.githubusercontent.com/USERNAME_MO/cashout-kita/main/app.html';
const KEY = 'ck_app_html';

const boot  = document.getElementById('boot');
const msg   = document.getElementById('msg');
const sub   = document.getElementById('sub');
const retry = document.getElementById('retry');
const frame = document.getElementById('app');

function show(html){
  frame.srcdoc = html;
  frame.hidden = false;
  boot.style.display = 'none';
}

async function start(){
  retry.hidden = true;
  const cached = localStorage.getItem(KEY);

  // 1. Kuha ng lokal na kopya (cache, o kung wala pa, yung kasama sa APK)
  let local = cached;
  if (!local) {
    try { local = await (await fetch('app.html')).text(); } catch(e){}
  }
  if (local) show(local);           // mabilis magbukas, offline-ready
  else msg.textContent = 'Checking for update…';

  // 2. Check online kung may bagong version
  try {
    const res = await fetch(APP_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    if (html !== cached) {
      localStorage.setItem(KEY, html);
      show(html);                   // may bago → gamitin agad
    }
  } catch (e) {
    if (!local) {                   // walang cache, walang internet, walang fallback
      msg.textContent = 'Hindi ma-load ang app.';
      sub.textContent = 'Kumonekta sa internet at subukan ulit.';
      retry.hidden = false;
    }
  }
}
start();
</script>

<div style="text-align:center;padding:12px">
  <button onclick="window.top.location.reload()"
    style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:bold">
    Check for Update
  </button>
</div>

</body>
</html>
